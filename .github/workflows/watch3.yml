name: watch-3

# Watches AMC Lincoln Square's Odyssey IMAX 70mm calendar for NEW showtimes
# (Sep 14/15 fill-ins, any Sep 17+ extension, new 2 AM overnight slots).
#
# POLLER 3 of 3 - staggered 200s against the others, so the three
# together check about every 100s and one is always mid-run when another
# hits GitHub's 6h job ceiling.
#
# CADENCE: a one-check-per-run design only managed a ~40 min median gap (24-66
# min observed) because GitHub throttles */5 schedules on low-traffic repos.
# So each run is now a long-lived poller: a check every 5 minutes for up to
# 5h50m (just under GitHub's 6h job ceiling). The */5 schedule keeps firing
# during a run and the concurrency group parks one firing as a PENDING run,
# which starts the moment the current one ends - chaining runs with no gap.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch3
  cancel-in-progress: false

env:
  POLL_SECONDS: "300"
  NAG_MINUTES: "15"     # a drop re-alerts every minute for 15 min
  NAG_INTERVAL: "60"
  SEAT_WATCH: "Sep 12,Sep 13,Sep 16"   # dates the user could attend
  START_OFFSET: "200"
  STATE_FILE: "state3.json"
  MAX_POLLS: "60"          # 70 x 5 min = 5h50m

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Poll every 5 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NAG_MINUTES: ${{ env.NAG_MINUTES }}
          NAG_INTERVAL: ${{ env.NAG_INTERVAL }}
          SEAT_WATCH: ${{ env.SEAT_WATCH }}
        run: |
          # align to a fixed slot within each 5-min window so the stagger
          # survives restarts (ad-hoc restarts had collapsed it, which let two
          # pollers raise duplicate alarms for the same event)
          sleep $(( (300 + START_OFFSET - $(date +%s) % 300) % 300 ))
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$MAX_POLLS"); do
            echo "--- poll $i/$MAX_POLLS at $(date -u '+%H:%M:%S UTC') ---"
            STATE_FILE="$STATE_FILE" python3 watcher.py || true
            # push state after every poll so a killed run never loses what it saw
            SEAT_SNAP="${STATE_FILE%.json}_seats.json"
            if [ -n "$(git status --porcelain "$STATE_FILE" "$SEAT_SNAP")" ]; then
              git add -A -- "$STATE_FILE" "$SEAT_SNAP" || true
              git commit -q -m "update state [skip ci]" || true
              git pull -q --rebase || true
              git push -q || true
            fi
            if [ "$i" -lt "$MAX_POLLS" ]; then sleep "$POLL_SECONDS"; fi
          done
