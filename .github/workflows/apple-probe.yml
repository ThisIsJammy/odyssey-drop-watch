name: apple-probe

# One-off investigation: can headless Chromium get past the Cloudflare challenge
# on applecinemas.com, and what does the page actually contain? Manual only.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Probe
        run: python apple_probe.py
