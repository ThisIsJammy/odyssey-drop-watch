name: zomato-delivery-watch

# Watches Burger King Koregaon Park on Zomato and alerts the moment online
# delivery opens. Same long-poller shape as the AMC watchers: GitHub throttles
# */5 schedules badly, so each run polls on its own timer for ~5h50m and the
# concurrency group parks the next run to start the instant this one ends.

on:
  schedule:
    # 11:15-22:45 IST = 05:45-17:15 UTC (watcher also gates per-poll)
    - cron: "*/5 5-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zomato
  cancel-in-progress: false

env:
  POLL_SECONDS: "180"      # delivery windows can be short - check every 3 min
  MAX_POLLS: "100"         # 116 x 3 min = 5h48m
  NAG_MINUTES: "15"
  NAG_INTERVAL: "60"
  WINDOW_START: "11:15"    # IST - user says outlet runs 11:30-22:30
  WINDOW_END: "22:45"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Poll Zomato delivery status
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_ZOMATO }}
          NAG_MINUTES: ${{ env.NAG_MINUTES }}
          NAG_INTERVAL: ${{ env.NAG_INTERVAL }}
          WINDOW_START: ${{ env.WINDOW_START }}
          WINDOW_END: ${{ env.WINDOW_END }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$MAX_POLLS"); do
            echo "--- poll $i/$MAX_POLLS at $(date -u '+%H:%M:%S UTC') ---"
            python3 zomato_watcher.py || true
            # commit the open/close history as it accrues - that log is what
            # reveals when this restaurant actually opens
            # `git diff --quiet` ignores untracked files and `git add` fails
            # wholesale if any pathspec is missing - together those silently
            # stopped state ever being committed. Use porcelain instead.
            if [ -n "$(git status --porcelain zomato_state.json zomato_history.jsonl)" ]; then
              git add -A -- zomato_state.json zomato_history.jsonl || true
              git commit -q -m "zomato status [skip ci]" || true
              git pull -q --rebase || true
              git push -q || true
            fi
            if [ "$i" -lt "$MAX_POLLS" ]; then sleep "$POLL_SECONDS"; fi
          done
