name: bms-seat-watch

# Watches Prasads Hyderabad PCX (Screen 6) for The Odyssey and alerts when a
# seat opens in the watched rows (I-N). Runs on GitHub's servers, so it keeps
# going with the laptop off.
#
# COVERAGE DESIGN - a true 5-minute cadence, non-stop until the show:
#   * GitHub throttles */5 schedules hard (measured ~46 min median between run
#     STARTS on this repo), so one-check-per-run is not enough.
#   * Instead each run is a long-lived poller: every 5 minutes for up to 5h50m
#     (just under GitHub's 6h job ceiling).
#   * The */5 schedule keeps firing while a run is active; the concurrency group
#     (cancel-in-progress: false) parks one of those as a PENDING run, which
#     starts the instant the current one ends. That chains runs back-to-back
#     with no gap, so coverage stays continuous across the 6h ceiling.
#   * Every poll checks the cutoff and exits cleanly once booking has closed,
#     so this stops itself after the show instead of running forever.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bms
  cancel-in-progress: false

env:
  # booking closes 07:50 IST on 2026-08-09 (15 min before the 08:05 show)
  CUTOFF_UTC: "2026-08-09T02:20:00Z"
  POLL_SECONDS: "300"
  MAX_POLLS: "70"          # 70 x 5 min = 5h50m

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Poll every 5 minutes until booking closes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_PRASADS }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CUTOFF=$(date -u -d "$CUTOFF_UTC" +%s)
          for i in $(seq 1 "$MAX_POLLS"); do
            NOW=$(date -u +%s)
            if [ "$NOW" -ge "$CUTOFF" ]; then
              echo "Booking cutoff ($CUTOFF_UTC) reached - stopping."
              exit 0
            fi
            echo "--- poll $i/$MAX_POLLS at $(date -u '+%H:%M:%S UTC'), $(( (CUTOFF-NOW)/60 )) min to cutoff ---"
            python3 bms_monitor.py || true
            # push state after each poll so a killed run never loses what it saw
            if ! git diff --quiet bms_state.json 2>/dev/null; then
              git add bms_state.json
              git commit -q -m "bms state [skip ci]" || true
              git pull -q --rebase || true
              git push -q || true
            fi
            sleep "$POLL_SECONDS"
          done
